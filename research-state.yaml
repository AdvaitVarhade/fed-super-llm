hypotheses:
  - id: H1
    statement: "FedSUPER matches centralized SUPER's calibration (Rmse-PC, MRMC) with <5% accuracy loss"
    status: supported
    motivation: "Blueprint merge is rank-structure-agnostic to backbone training — only depends on item popularity and user blueprints (public)"
    parent: null
    priority: high
  - id: H2
    statement: "DP noise improves calibration in non-SUPER settings (FedNCF-DP) but is redundant in FedSUPER (blue IS perfect calibration)"
    status: supported
    motivation: "Popular item gradients receive more DP noise thus scores are suppressed; but theuper modes hard modoto overrides"
    parent: H1
    priority: high
  - id: H3
    statement: "LLM-based user profiling (Sentence-BERT, cos_buv) recovers >=20% of FedSUPER accuracy loss and expands long-tail coverage 2x"
    status: supported
    motivation: "LLM semantic scores provide orthogonal discriminative signal interrogative interaction freq, rescuing test items from non-winning candidate pools"
    parent: H1
    priority: high
  - id: H4
    statement: "Multi-objective popularity-dispersion training has marginal effect on FedSUPER (blueprint merge already saturates calibration)"
    status: refuted
    motivation: "Blueprint merge constrains per-user head/tail quota; multi-obj training only affects per-pool ranking, dominated by LLM signal"
    parent: null
    priority: medium
  - id: H5
    statement: "Adaptive DP noise (per-item pop-scaled) provides incremental recall improvements but doesn't shift frontier substantially under SUPER blueprint"
    status: inconclusive
    motivation: "Adaptive noise adds variable suppression on popular items but blueprint merge makes gains modest"
    parent: H2
    priority: medium

