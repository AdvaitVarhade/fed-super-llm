# Project: Privacy-Preserving Fair & Diverse Recommendations (SUPER extension)

project:
  title: "Privacy-Preserving Federated SUPER: FL + LLM Profiling for Fair Recommendations with Guaranteed Popularity Calibration"
  question: "Can the SUPER popularity-exposure-calibration framework be made privacy-preserving via Federated Learning while maintaining paper-level calibration guarantees, and additionally augmented with LLM-based user profiling to recover accuracy?"
  status: paper-draft
  started: "2026-08-01"
  domain: "Recommender Systems, Fairness-aware Recommendation, Federated Learning, Privacy, LLM Profiling"

base_paper:
  title: "SUPER: Smart User-Centric Popularity Exposure Reduction for Fair and Diverse Recommendations"
  authors: "Yavru, Yalcin, Bilge, Gunduz"
  year: 2026
  venue: "IEEE Access 14:37582-37605"
  doi: "10.1109/access.2026.3671645"
  core_method: "Pareto partition alpha=0.20, dual model training (M_pop on head items, M_tail on tail items), Pop_u = |C_u ∩ H|/|C_u|, blueprint-based merge: hard quota N_pop=floor(N*Pop_u) / soft blueprint from Lu"

